name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: job_runner
          POSTGRES_USER: job_runner
          POSTGRES_PASSWORD: job_runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_runner -d job_runner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JOB_RUNNER_DATABASE_URL: postgresql+asyncpg://job_runner:job_runner@localhost:5432/job_runner
      JOB_RUNNER_REDIS_URL: redis://localhost:6379/0
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check shell script syntax
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            [[ -e "$script" ]] || continue
            bash -n "$script"
          done

      - name: Run public-safety guardrail
        run: bash scripts/check-public-safety.sh

      - name: Run architecture boundary guardrail
        run: bash scripts/check-architecture-boundaries.sh

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Apply Alembic migrations
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        run: uv run pytest --cov=job_runner_platform --cov-report=term-missing
