[project]
name = "job-runner-platform"
version = "0.1.0"
description = "Public-safe portfolio background job runner platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "prometheus-client>=0.23.0",
    "pydantic-settings>=2.14.1",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.44",
]

[project.scripts]
job-runner-worker = "job_runner_platform.worker.cli:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_runner_platform"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["job_runner_platform"]

[tool.coverage.report]
show_missing = true
